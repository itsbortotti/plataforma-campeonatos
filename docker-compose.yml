services:
  postgres:
    image: postgres:16-alpine
    container_name: sfl-postgres
    environment:
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
      POSTGRES_DB: sfl
    ports:
      - "5434:5432"
    volumes:
      - sfl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sfl_pg:
