<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SFL — Plataforma de campeonatos">
  <defs>
    <linearGradient id="sfl-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A3F72"/>
      <stop offset="1" stop-color="#15244F"/>
    </linearGradient>
    <linearGradient id="sfl-shine" x1="16" y1="6" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Casa da plataforma (marca do sistema, não do campeonato) -->
  <rect width="64" height="64" rx="16" fill="url(#sfl-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#sfl-shine)"/>
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="14" fill="none" stroke="#C15622" stroke-width="2.5"/>

  <!--
    Significado:
    - bola = futebol
    - SFL = nome do sistema
    - 3 pontos = vários campeonatos na mesma plataforma
  -->

  <!-- Bola de futebol -->
  <g transform="translate(32 20)">
    <circle r="11" fill="#FFFFFF" opacity="0.1"/>
    <circle r="11" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
    <path d="M0-4.6 L4.4-1.5 L2.7 3.6 L-2.7 3.6 L-4.4-1.5 Z" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="1.25" stroke-linecap="round" fill="none">
      <path d="M0-4.6 L0-11"/>
      <path d="M4.4-1.5 L9.5-3.4"/>
      <path d="M2.7 3.6 L6.7 8.5"/>
      <path d="M-2.7 3.6 L-6.7 8.5"/>
      <path d="M-4.4-1.5 L-9.5-3.4"/>
    </g>
  </g>

  <!-- Monograma SFL -->
  <text
    x="32"
    y="46.5"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="900"
    letter-spacing="1.2"
  >SFL</text>

  <!-- Três campeonatos sob a mesma casa -->
  <circle cx="24" cy="55.2" r="1.9" fill="#C15622"/>
  <circle cx="32" cy="55.2" r="1.9" fill="#C15622"/>
  <circle cx="40" cy="55.2" r="1.9" fill="#C15622"/>
</svg>
