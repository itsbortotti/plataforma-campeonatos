# SFL — Plataforma de campeonatos (Render Blueprint, plano barato)
# Workspace Hobby + compute Starter (~US$7 + US$7) + Postgres basic-256mb (~US$6) ≈ US$20/mês
#
# Dashboard → New → Blueprint → repo itsbortotti/plataforma-campeonatos
# Depois do 1º deploy: defina JWT_SECRET / CRON_SECRET se pedirem, rode seed se SEED_ADMIN=true
# DNS Hostinger: CNAME @/www → sfl-web.onrender.com (e custom domain no serviço web)

databases:
  - name: sfl-db
    plan: basic-256mb
    databaseName: sfl
    diskSizeGB: 1

services:
  - type: web
    name: sfl-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: sfl-uploads
      mountPath: /var/data
      sizeGB: 1
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sfl-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        fromService:
          name: sfl-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: sfl-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_ADMIN
        value: "true"
      - key: SEED_ADMIN_USER
        value: master
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: sfl-web
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    domains:
      - sflcampeonato.com.br
      - www.sflcampeonato.com.br
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: sfl-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: cron
    name: sfl-finalize-stale
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 9 * * *"
    dockerCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$PUBLIC_API_URL/api/cron/finalize-stale-matches"'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sfl-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: sfl-api
          type: web
          envVarKey: JWT_SECRET
      - key: CRON_SECRET
        fromService:
          name: sfl-api
          type: web
          envVarKey: CRON_SECRET
      - key: PUBLIC_API_URL
        fromService:
          name: sfl-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
